name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home-page
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: home-page/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source
        run: pnpm lint

      - name: Build application
        run: pnpm build:local

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static website
        run: |
          mkdir -p home-page/github-pages
          cp -R home-page/public/. home-page/github-pages/
          cp home-page/static/index.html home-page/github-pages/index.html
          cp home-page/app/home.css home-page/github-pages/home.css
          cp home-page/components/home/project-card.css home-page/github-pages/project-card.css
          find home-page/github-pages -type f -name '*.html' -exec sed -i \
            -e "s|site-shell.css\"|site-shell.css?v=${GITHUB_SHA}\"|g" \
            -e "s|site-shell.js\"|site-shell.js?v=${GITHUB_SHA}\"|g" {} +
          touch home-page/github-pages/.nojekyll

      - name: Audit static website
        run: node home-page/scripts/audit-static.mjs home-page/github-pages

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: home-page/github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
